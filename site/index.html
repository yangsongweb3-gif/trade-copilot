// 恐惧贪婪半圆仪表：分段按 alternative.me 的标准，黑点指当前值
const FNG_BANDS = [[0, 25, '#d03b3b'], [25, 45, '#eb8a34'], [45, 56, '#f2c230'], [56, 76, '#9ccc3c'], [76, 101, '#3fb37f']];
function fngGauge(v, label) {
  const cx = 60, cy = 56, r = 44;
  const ang = (x) => Math.PI * (1 - Math.min(x, 100) / 100);          // 0 在左边，100 在右边
  const pt = (x) => `${(cx + r * Math.cos(ang(x))).toFixed(1)},${(cy - r * Math.sin(ang(x))).toFixed(1)}`;
  const arcs = FNG_BANDS.map(([a, b, c]) =>
    `<path d="M${pt(a + 1.5)} A${r} ${r} 0 0 1 ${pt(Math.min(b, 100) - 1.5)}" stroke="${c}" stroke-width="8" stroke-linecap="round" fill="none"/>`).join('');
  const color = FNG_BANDS.find(([a, b]) => v >= a && v < b)[2];
  const [dx, dy] = pt(v).split(',');
  const w = label.length * 13 + 16;
  return `<svg class="fng" viewBox="0 0 120 80" role="img" aria-label="恐惧贪婪指数 ${v}，${esc(label)}">${arcs}
    <circle cx="${dx}" cy="${dy}" r="6.5" fill="#1a1a1a" stroke="var(--paper)" stroke-width="2.5"/>
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" class="fng-num">${v}</text>
    <rect x="${cx - w / 2}" y="${cy + 6}" width="${w}" height="18" rx="9" fill="${color}" stroke="#1a1a1a" stroke-width="2"/>
    <text x="${cx}" y="${cy + 19}" text-anchor="middle" class="fng-label">${esc(label)}</text></svg>`;
}

// ---- 杠杆情绪：表格里的小卡片 + 宏观区的详情面板（数据都来自币安合约公开接口） ----
const FUNDING_HOT = 0.0003;   // 和 regime.py 的过热线一致
const LEV_PANEL = { ind: '杠杆情绪', news: /爆仓|清算|杠杆|资金费率|持仓量|多空/ };
const fundPct = (v, n) => `${(v * 100).toFixed(n)}%`;
const avgLast = (vals, n) => vals.slice(-n).reduce((a, b) => a + b, 0) / Math.min(n, vals.length);
const chgPct = (vals, n) => (vals.length > n ? (vals.at(-1) / vals.at(-1 - n) - 1) * 100 : null);

function levCell(mc) {
  const f = mc.funding.values, oi7 = mc.oi ? chgPct(mc.oi.values, 7) : null;
  return `<a class="etf-link jump" href="#macro-lev" title="查看杠杆详情">
    <span class="coin lev" aria-hidden="true">⚖</span><b class="etf-v">费率 ${fundPct(f.at(-1), 4)}</b>
    <small>7 天均 ${fundPct(avgLast(f, 21), 4)}${oi7 == null ? '' : ` · 持仓 7 天 ${pctStr(oi7)}`} · 详情 →</small></a>`;
}

function levPanel(d) {
  const ind = d.indicators.find((i) => i.name === LEV_PANEL.ind);
  const s = ind?.score == null ? 'missing' : `s${ind.score}`;
  const mc = d.macro || {};
  const head = `<div class="macro-head"><h3 class="fun">杠杆情绪</h3><span class="asof">费率截至 ${esc(d.asof?.funding || '—')}</span><span class="chip ${s}">${CHIP[ind?.score ?? null]}</span>
    <span class="macro-concl">${esc(ind ? split(ind.text).concl : '数据缺失')}</span></div>`;
  if (!mc.funding) return `<div class="panel macro" id="macro-lev">${head}<div class="empty">数据缺失</div></div>`;
  const f = mc.funding.values, avg7 = avgLast(f, 21);
  const stats = [`<div class="stat"><small>资金费率（${mc.funding.dates.at(-1).slice(5)} 北京时间）</small><b class="num">${fundPct(f.at(-1), 4)}</b>
      <span class="chg num">7 天平均 ${fundPct(avg7, 4)}</span><span class="chg num">折合年化约 ${(avg7 * 3 * 365 * 100).toFixed(1)}%</span></div>`];
  if (mc.oi) {
    const o = mc.oi.values, usd = mc.oi_usd?.values.at(-1);
    stats.push(`<div class="stat"><small>持仓量</small><b class="num">${fmt(o.at(-1))} BTC</b>
      ${usd ? `<span class="chg num">约 ${money(usd / 1e6).slice(1)}</span>` : ''}
      <span class="chg num">7 天 ${pctStr(chgPct(o, 7))}</span>${o.length > 29 ? `<span class="chg num">30 天 ${pctStr(chgPct(o, o.length - 1))}</span>` : ''}</div>`);
  }
  if (mc.ls_ratio) {
    const long = mc.ls_long.values.at(-1);
    stats.push(`<div class="stat"><small>多空账户比</small><b class="num">${mc.ls_ratio.values.at(-1).toFixed(2)}</b>
      <span class="chg num">做多 ${(long * 100).toFixed(0)}% · 做空 ${((1 - long) * 100).toFixed(0)}%</span></div>`);
  }
  return `<div class="panel macro" id="macro-lev">${head}
    <div class="lev-stats">${stats.join('')}</div>
    <div class="macro-charts two">
      <div class="mseries"><div class="stat"><small>资金费率 · 近 30 天（每 8 小时一根，北京时间）</small></div><div class="chart mchart" id="mc-funding"></div></div>
      <div class="mseries"><div class="stat"><small>持仓量 vs BTC 价格 · 第一天 = 100</small></div><div class="chart mchart" id="mc-oi"></div></div>
    </div>
    <div class="macro-more">
      <details class="drop"><summary class="fun">为什么看它</summary><div class="drop-body why">
        资金费率为正，说明做多的人多、多头付钱给空头；费率越高，多头越拥挤，一旦下跌容易连环爆仓。
        持仓量代表合约里押了多少钱：持仓猛增而价格没跟上，说明杠杆在堆积。多空账户比是做多和做空的账户数之比，散户情绪的参考。
        打分：7 天平均费率超过 0.03% 计 −1；持仓量 7 天涨超 15% 而 BTC 涨不到 3% 也计 −1；其余 0。数据来自币安合约公开接口。</div></details>
      <details class="drop"><summary class="fun">相关快讯 <span class="cnt" id="mc-cnt-${LEV_PANEL.ind}"></span></summary>
        <ul class="drop-body feed" id="mn-${LEV_PANEL.ind}"><li class="empty">海星正在翻报纸…</li></ul></details>
    </div>
  </div>`;
}

      <details class="drop"><summary class="fun">为什么看它</summary><div class="drop-body why">
        美国现货 BTC ETF 的申购赎回代表传统资金的进出：持续净流入说明机构在买，持续净流出说明在撤。数据来自 tftc.io，美股收盘后更新。
        打分：近 5 个交易日累计净流入超过 +5 亿美元计 +1，净流出超过 5 亿美元计 −1，其余 0。</div></details>

// 柱状图：正数向上、负数向下，零线加粗；悬停整列显示提示框
// opts: height, yFmt 轴刻度, vFmt 提示框数值, name 提示框里的名字, pos/neg 正负柱颜色, refs [{v, label}] 参考虚线
function barChart(box, dates, values, opts) {
  box.querySelector('svg')?.remove();
  let tip = box.querySelector('.tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip); }
  const W = box.clientWidth, H = opts.height, n = values.length;
  const m = { t: 10, r: 12, b: 26, l: 56 };
  const refVals = (opts.refs || []).map((r) => r.v);
  const vmin = Math.min(0, ...values, ...refVals), vmax = Math.max(0, ...values, ...refVals);
  const step = niceStep((vmax - vmin) / 4 || 1);
  const lo = Math.floor(vmin / step) * step, hi = Math.ceil(vmax / step) * step;
  const bw = (W - m.l - m.r) / n, w = Math.max(2, bw * 0.68);
  const y = (v) => m.t + ((hi - v) * (H - m.t - m.b)) / (hi - lo);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.label)}">`;
  for (let v = lo; v <= hi + step / 1e6; v += step) {
    svg += `<line class="grid-line" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text class="axis-text num" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${opts.yFmt(v)}</text>`;
  }
  const every = Math.ceil(n / (W < 500 ? 3 : W < 800 ? 5 : 7));
  for (let i = n - 1; i >= 0; i -= every) {
    svg += `<text class="axis-text num" x="${m.l + (i + 0.5) * bw}" y="${H - 6}" text-anchor="middle">${dates[i].slice(5)}</text>`;
  }
  values.forEach((v, i) => {
    const top = Math.min(y(v), y(0)), h = Math.max(1, Math.abs(y(v) - y(0)));
    svg += `<rect class="bar" data-i="${i}" x="${(m.l + i * bw + (bw - w) / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"
      rx="${Math.min(2, w / 3)}" fill="${v >= 0 ? opts.pos : opts.neg}"/>`;
  });
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--text-2)" stroke-width="1.5"/>`;
  for (const r of opts.refs || []) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="var(--critical)" stroke-width="1.5" stroke-dasharray="5 4"/>`
      + `<text class="axis-text" x="${W - m.r - 4}" y="${y(r.v) - 4}" text-anchor="end">${r.label}</text>`;
  }
  values.forEach((_, i) => { svg += `<rect class="hitbar" data-i="${i}" x="${m.l + i * bw}" y="0" width="${bw}" height="${H - m.b}" fill="transparent"/>`; });
  svg += '</svg>';
  box.insertAdjacentHTML('afterbegin', svg);
  box.querySelectorAll('.hitbar').forEach((r) => {
    r.addEventListener('pointerenter', () => {
      const i = +r.dataset.i;
      box.querySelectorAll('.bar').forEach((b) => b.classList.toggle('dim', +b.dataset.i !== i));
      tip.innerHTML = `<div class="d num">${dates[i]}</div><div class="r"><span>${opts.name}</span><b class="num">${opts.vFmt(values[i])}</b></div>`;
      tip.style.display = 'block';
      const cx = m.l + (i + 0.5) * bw;
      tip.style.left = `${cx + 14 + tip.offsetWidth > W ? cx - 14 - tip.offsetWidth : cx + 14}px`;
      tip.style.top = `${m.t}px`;
    });
  });
  box.querySelector('svg').addEventListener('pointerleave', () => {
    tip.style.display = 'none';
    box.querySelectorAll('.bar').forEach((b) => b.classList.remove('dim'));
  });
}

  const items = (d.changes || []).map((c) => `<li class="${c.tone}"><span class="arw">${arrow[c.tone]}</span>${esc(c.text)}</li>`).join('')

  return `<section class="panel changes" aria-label="今日变化"><h3 class="fun">今日变化 <small>对比昨天</small></h3><ul>${items}</ul>${note}</section>`;
}

function historyStrip(h) {
  if (!h.length) return '';
  const dots = h.map((x) => `<span class="hd ${x.light}" title="${x.date} ${LIGHT_NAME[x.light]} · 综合 ${x.score > 0 ? '+' : ''}${x.score}"></span>`).join('');
  return `<div class="hist"><small>近 30 天灯色</small>${dots}${h.length < 30 ? `<small>已记录 ${h.length} 天</small>` : ''}</div>`;
}

// ---- 关键价位：最上面一条，压力在上、支撑在下，都从近到远 ----
function levelsPanel(lv, asof) {

  const chip = (x) => {

const BJ = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function bjTime(iso) {
  const p = Object.fromEntries(BJ.formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
  return { day: `${p.month}/${p.day} ${p.weekday}`, time: `${p.hour}:${p.minute}` };
}

const fcOf = (f, p) => [f && `预期 ${esc(f)}`, p && `前值 ${esc(p)}`].filter(Boolean).join(' · ');

function agendaPanel(events) {
  if (!events.length) return '<section class="panel agenda"><div class="empty">未来 7 天没有查到美国的中高影响数据</div></section>';
  let lastDay = '';
  const rows = events.map((e) => {
    const t = bjTime(e.time), past = new Date(e.time) < new Date();
    const day = t.day === lastDay ? '' : t.day;
    lastDay = t.day;
    // 合并的发布（如标普制造业 + 服务业 PMI）逐项列出；项名去掉和标题重复的词，"标普制造业 PMI 初值" → "制造业"
    const short = (name) => e.title.split(' ').reduce((n, w) => n.replace(w, ''), name).trim() || name;
    const fc = e.items?.length
      ? e.items.map((i) => `<div>${esc(short(i.title))}：${fcOf(i.forecast, i.previous)}</div>`).join('')
      : e.note ? esc(e.note) : fcOf(e.forecast, e.previous);
    return `<li class="${past ? 'past' : ''} ${e.impact}">
      <span class="ag-day fun">${day}</span><span class="ag-time num">${t.time}</span>
      <span class="ag-title">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" title="打开官方发布页：${esc(new URL(e.url).hostname)}">${esc(e.title)}<span class="ext" aria-hidden="true">↗</span></a>` : esc(e.title)} <span class="imp ${e.impact}">${e.impact === 'high' ? '高影响' : '中影响'}</span>${past ? ' <span class="imp">已过</span>' : ''}</span>
      <span class="ag-fc num">${fc}</span>
    </li>`;
  }).join('');
  return `<section class="panel agenda"><ul>${rows}</ul></section>`;
}

// 用今天的数据说清楚三条线的位置关系，和后端 regime.py 的判断一致
function maToday(btc) {
  const n = btc.closes.length;
  const c = btc.closes[n - 1], m20 = btc.ma20[n - 1], m50 = btc.ma50[n - 1];
  const slope = m20 > btc.ma20[n - 6] ? '向上' : '向下';
  let cls = '', state;
  if (c > m20 && m20 > m50) { cls = 'up'; state = '多头排列'; }
  else if (c < m20 && m20 < m50) { cls = 'down'; state = '空头排列'; }
  else state = '均线纠缠，方向不明';
  const pos = (v, name) => `${c > v ? '在' : '跌破'} ${name}（${fmt(v)}）${c > v ? '上方' : ''}`;
  return `<div class="today ${cls} num"><small class="fun">今天</small>收盘 ${fmt(c)}，${pos(m20, 'MA20')}，${pos(m50, 'MA50')}；`
    + `MA20 近 5 天${slope} → <b>${state}</b></div>`;
}

function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

// 通用折线图：dates 和每条线的 values 一一对应；带十字线和提示框
// opts: height, yFmt(v, step) 轴刻度, vFmt(v) 提示框数值, endLabels 线尾标名字, label 无障碍描述
function lineChart(box, dates, series, opts) {
  box.querySelector('svg')?.remove();
  let tip = box.querySelector('.tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip); }
  const W = box.clientWidth, H = opts.height;
  const m = { t: 10, r: opts.endLabels ? 48 : 12, b: 26, l: 52 };
  const n = dates.length;
  const vals = series.flatMap((s) => s.values).filter((v) => v != null);
  const step = niceStep((Math.max(...vals) - Math.min(...vals)) / 4 || Math.abs(vals[0]) / 100 || 1);
  const lo = Math.floor(Math.min(...vals) / step) * step, hi = Math.ceil(Math.max(...vals) / step) * step || lo + step;
  const x = (i) => m.l + (i * (W - m.l - m.r)) / (n - 1);
  const y = (v) => m.t + ((hi - v) * (H - m.t - m.b)) / (hi - lo);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.label)}">`;
  for (let v = lo; v <= hi + step / 1e6; v += step) {
    svg += `<line class="grid-line" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text class="axis-text num" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${opts.yFmt(v, step)}</text>`;
  }
  const every = Math.ceil(n / (W < 500 ? 3 : W < 800 ? 5 : 7));
  for (let i = n - 1; i >= 0; i -= every) {
    svg += `<text class="axis-text num" x="${x(i)}" y="${H - 6}" text-anchor="middle">${dates[i].slice(5)}</text>`;
  }
  for (const s of series) {
    let d = '', pen = false;
    s.values.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    svg += `<path class="line" d="${d}" stroke="${s.color}"/>`;
  }
  if (opts.endLabels) {   // 线尾直接标名字，太挤时上下错开
    const ends = series.map((s) => ({ name: s.name, y: y(s.values[n - 1]) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 13);
    for (const e of ends) svg += `<text class="end-label" x="${W - m.r + 6}" y="${e.y + 4}">${e.name}</text>`;
  }
  svg += `<g class="cross-g" style="display:none"><line class="cross" y1="${m.t}" y2="${H - m.b}"/>`;
  series.forEach((s, k) => { svg += `<circle class="dot" r="4" fill="${s.color}" data-k="${k}"/>`; });
  svg += `</g><rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg>`;
  box.insertAdjacentHTML('afterbegin', svg);

  const cross = box.querySelector('.cross-g');
  const hit = box.querySelector('.hit');
  hit.addEventListener('pointermove', (ev) => {
    const r = box.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round(((ev.clientX - r.left - m.l) / (W - m.l - m.r)) * (n - 1))));
    const cx = x(i);
    cross.style.display = '';
    cross.querySelector('line').setAttribute('x1', cx);
    cross.querySelector('line').setAttribute('x2', cx);
    cross.querySelectorAll('circle').forEach((c) => {
      const v = series[c.dataset.k].values[i];
      c.style.display = v == null ? 'none' : '';
      if (v != null) { c.setAttribute('cx', cx); c.setAttribute('cy', y(v)); }
    });
    tip.innerHTML = `<div class="d num">${dates[i]}</div>` + series.map((s) =>
      `<div class="r"><span><i style="background:${s.color}"></i>${s.name}</span><b class="num">${s.values[i] == null ? '—' : opts.vFmt(s.values[i])}</b></div>`).join('');
    tip.style.display = 'block';
    tip.style.left = `${cx + 14 + tip.offsetWidth > W ? cx - 14 - tip.offsetWidth : cx + 14}px`;
    tip.style.top = `${m.t}px`;
  });
  hit.addEventListener('pointerleave', () => { cross.style.display = 'none'; tip.style.display = 'none'; });
}

const kFmt = (v, step) => `${(v / 1000).toFixed(step >= 1000 ? 0 : 1)}k`;
const maOf = (vals, n) => vals.map((_, i) => (i >= n - 1 ? vals.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n : null));

function drawCharts() {

                           { name: 'MA50', color: 'var(--series-3)', values: maOf(vals, 50) });
    lineChart(box, d.dates.slice(cut), lines.map((l) => ({ ...l, values: l.values.slice(cut) })),
      { height: c.series.length > 1 ? 170 : 200, yFmt: ser.yFmt, vFmt: ser.vFmt, endLabels: !!ser.ma, label: `${ser.name}近 ${MACRO_DAYS} 天走势` });
  }
  const mc = current.macro || {};
  if (mc.funding && $('#mc-funding')) {
    barChart($('#mc-funding'), mc.funding.dates, mc.funding.values, {
      height: 190, label: '近 30 天资金费率', name: '资金费率', vFmt: (v) => fundPct(v, 4),

    });
  }
  if (mc.oi && $('#mc-oi')) {
    // 持仓量和 BTC 价格都换算成"第一天 = 100"，放在同一个坐标轴上比
    const price = Object.fromEntries(current.btc.dates.map((dt, i) => [dt, current.btc.closes[i]]));
    const days = mc.oi.dates.filter((dt) => price[dt] != null);
    const oiBy = Object.fromEntries(mc.oi.dates.map((dt, i) => [dt, mc.oi.values[i]]));
    const idx = (vals) => vals.map((v) => (v / vals[0]) * 100);
    if (days.length > 1) {
      lineChart($('#mc-oi'), days, [
        { name: '持仓量', color: 'var(--series-2)', values: idx(days.map((dt) => oiBy[dt])) },
        { name: 'BTC 价格', color: 'var(--series-1)', values: idx(days.map((dt) => price[dt])) },
      ], { height: 190, yFmt: (v, st) => v.toFixed(st >= 1 ? 0 : 1), vFmt: (v) => v.toFixed(1), endLabels: true, label: '持仓量与 BTC 价格对比，第一天为 100' });
    }
  }
  if (mc.premium && $('#mc-premium')) {
    barChart($('#mc-premium'), mc.premium.dates, mc.premium.values, {
      height: 190, label: 'Coinbase 溢价近 7 天（每小时）', name: 'Coinbase 溢价', vFmt: (v) => `${v > 0 ? '+' : ''}${v.toFixed(3)}%`,
      yFmt: (v) => `${v > 0 ? '+' : ''}${v.toFixed(2)}%`, pos: 'var(--series-1)', neg: 'var(--critical)',
    });
  }
  const etf = current.macro?.etf;
  if (etf && $('#mc-etf')) {
    barChart($('#mc-etf'), etf.dates.slice(-ETF_DAYS), etf.values.slice(-ETF_DAYS), {
      height: 200, label: `ETF 近 ${ETF_DAYS} 个交易日净流入`, name: '净流入', vFmt: money, pos: 'var(--good)', neg: 'var(--critical)',
      yFmt: (v) => (v === 0 ? '0' : `${v < 0 ? '−' : ''}${Math.abs(v) >= 1000 ? `${(Math.abs(v) / 1000).toFixed(1)}B` : `${Math.abs(v).toFixed(0)}M`}`),
    });
  }
}

// ---- 三个宏观指标的详细面板 ----
const MACRO_DAYS = 90;
const MACRO = [
  {
    ind: '纳斯达克', news: /美股|纳指|纳斯达克|标普|道指|英伟达|科技股|财报/,
    why: '加密货币和美股科技股的联动很强。纳指走弱时整体风险偏好下降，BTC 和山寨通常也跟着承压。'
      + '打分方式和 BTC 一样：收盘 > MA20 > MA50 计 +1，收盘 < MA20 < MA50 计 −1，其余 0。',
    series: [{ key: 'nasdaq', name: '纳斯达克', ma: true, yFmt: kFmt, vFmt: fmt, chg: [[1, '1日'], [5, '5日'], [20, '20日']], unit: 'pct' }],
  },
  {
    ind: '美元/美债', news: /美联储|降息|加息|美债|国债|美元指数|CPI|PCE|非农|鲍威尔|FOMC|通胀|失业率/,
    why: '美元指数和美债收益率上升，代表美元走强、资金成本变高，对 BTC 这类风险资产是压力；两者回落则是顺风。'
      + '打分：20 个交易日美元涨超 1.5% 或 10 年期收益率升超 0.25 个百分点计 −1，美元跌超 1.5% 计 +1，其余 0。',
    series: [
      { key: 'dxy', name: '美元指数', yFmt: (v, st) => v.toFixed(st >= 1 ? 0 : 1), vFmt: (v) => v.toFixed(2),
        chg: [[1, '1日'], [5, '5日'], [20, '20日']], unit: 'pct' },
      { key: 'us10y', name: '美债 10 年收益率', yFmt: (v, st) => `${v.toFixed(st >= 0.1 ? 1 : 2)}%`, vFmt: (v) => `${v.toFixed(3)}%`,
        chg: [[1, '1日'], [5, '5日'], [20, '20日']], unit: 'bp' },
    ],
  },
  {
    ind: '稳定币总量', news: /稳定币|Tether|Circle|(^|[^A-Za-z])(USDT|USDC|USDe|RLUSD|PYUSD)([^A-Za-z]|$)/,
    why: '稳定币是场内的“弹药”。总量增加说明有新资金换成稳定币进场，减少说明资金在离场。'
      + '打分：30 天增加 2% 以上计 +1，减少 1% 以上计 −1，其余 0。',
    series: [{ key: 'stables', name: '稳定币总市值', yFmt: (v, st) => `$${(v / 1e9).toFixed(st >= 1e9 ? 0 : 1)}B`,
      vFmt: (v) => `$${(v / 1e9).toFixed(2)}B`, chg: [[1, '1日'], [7, '7日'], [30, '30日']], unit: 'pct' }],
  },
];

// 涨跌只标方向（▲▼），不上红绿色：美元、利率上涨对加密是压力，颜色容易误导
function chgPills(vals, ser) {
  return ser.chg.map(([k, label]) => {
    if (vals.length <= k) return '';
    const a = vals[vals.length - 1 - k], b = vals[vals.length - 1];
    const diff = ser.unit === 'bp' ? Math.round((b - a) * 100) : r1((b / a - 1) * 100);
    const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '';
    return `<span class="chg num">${label} ${arrow}${ser.unit === 'bp' ? `${Math.abs(diff)}bp` : `${Math.abs(diff).toFixed(1)}%`}</span>`;
  }).join('');
}

function macroPanel(c, d) {
  const ind = d.indicators.find((i) => i.name === c.ind);
  const s = ind?.score == null ? 'missing' : `s${ind.score}`;
  const concl = ind ? split(ind.text).concl : '数据缺失';
  const charts = c.series.map((ser) => {
    const m = d.macro?.[ser.key];
    if (!m) return `<div class="mseries"><div class="stat"><small>${ser.name}</small><b>—</b></div><div class="empty">数据缺失</div></div>`;
    return `<div class="mseries">
      <div class="stat"><small>${ser.name}</small><b class="num">${ser.vFmt(m.values.at(-1))}</b>${chgPills(m.values, ser)}</div>
      <div class="chart mchart" id="mc-${ser.key}"></div>
    </div>`;
  }).join('');
  return `<div class="panel macro">
    <div class="macro-head"><h3 class="fun">${c.ind}</h3><span class="chip ${s}">${CHIP[ind?.score ?? null]}</span><span class="macro-concl">${esc(concl)}</span>
      <span class="asof">截至 ${esc(d.asof?.[c.series[0].key] || '—')}</span></div>
    <div class="macro-charts ${c.series.length > 1 ? 'two' : ''}">${charts}</div>
    <div class="macro-more">
      <details class="drop"><summary class="fun">为什么看它</summary><div class="drop-body why">${c.why}</div></details>
      <details class="drop"><summary class="fun">相关快讯 <span class="cnt" id="mc-cnt-${c.ind}"></span></summary>
        <ul class="drop-body feed" id="mn-${c.ind}"><li class="empty">海星正在翻报纸…</li></ul></details>
    </div>
  </div>`;
}

// 从 PANews 快讯里挑出和每个宏观指标相关的最新 3 条；只看标题，摘要里的词太杂
function renderMacroNews() {
  if (!news) return;
  for (const c of [...MACRO, LEV_PANEL, ETF_PANEL, PREM_PANEL]) {
    const box = document.getElementById(`mn-${c.ind}`);
    if (!box) continue;
    const hits = news.flash.filter((n) => c.news.test(n.title)).slice(0, 3);
    box.innerHTML = hits.map(newsItem).join('') || '<li class="empty">最近没有相关快讯</li>';
    document.getElementById(`mc-cnt-${c.ind}`).textContent = hits.length;
  }
}

let current = null;
async function load(refresh = false) {
  const btn = $('#refresh');
  btn.disabled = true;
  btn.textContent = '捞数据中…';
  try {
    const r = await fetch(api('regime', refresh));
    if (!r.ok) throw new Error(`服务返回 ${r.status}`);
    current = await r.json();
    render(current);
  } catch (e) {
    if (!current) $('#app').innerHTML = `<div class="panel state err">数据拉取失败：${esc(e.message)}<br>检查代理（.env 里的 HTTPS_PROXY）后点"刷新数据"</div>`;
    else alert(`刷新失败：${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '刷新数据';
  }
}

$('#refresh').addEventListener('click', () => { load(true); loadAltNames(true); loadNews(true); });
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => current && drawCharts(), 150);
});
// 全部加载完后把整页高度写到 <html data-report-h>，截图脚本按这个高度截
Promise.all([load(), loadAltNames(), loadNews()]).then(() => setTimeout(() => {
  document.documentElement.dataset.reportH = Math.ceil(document.documentElement.scrollHeight);
}, 500));
</script>
